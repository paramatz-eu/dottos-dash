# Choose this build instead of the piezo build when using a MAX98357A I2S amp.

substitutions:
  device_name: dottos-dash-max

packages:
  common: !include dottos-dash-common.yaml

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    id: max98357a_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO22
    dac_type: external
    channel: mono

rtttl:
  speaker: max98357a_speaker
